name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CPU dependencies / 安装 CPU 依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch>=2.6,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Validate model and optimizer step / 检查模型与单批更新
        run: |
          python check.py --part model
          python check.py --part step
      - name: Run synthetic pipeline tests / 运行合成数据流程测试
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        run: python -m unittest discover -s tests -v
